[package]
name = "siteboard"
version = "1.0.0"
description = "Siteboard - Artboard app for the web"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "siteboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tokio = { version = "1", features = ["sync"] }

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
block2 = "0.6"
base64 = "0.22"
